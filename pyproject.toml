[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timer"
version = "0.3.0"
description = "A persistent local timer and stopwatch for the command line"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
timer = "timer_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
